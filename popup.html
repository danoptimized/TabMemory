<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --bar:#ff9f0a; --hover:#f2f2f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --fg:#f5f5f7; --muted:#98989d; --line:#38383a; --bar:#ff9f0a; --hover:#2c2c2e; }
  }
  body { margin:0; width:440px; background:var(--bg); color:var(--fg); font:13px -apple-system, system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; justify-content:space-between; padding:12px 14px 8px; border-bottom:1px solid var(--line); }
  h1 { font-size:14px; margin:0; margin-right:auto; }
  #total, .note { color:var(--muted); font-size:12px; }
  .note { padding:6px 14px 8px; border-bottom:1px solid var(--line); }
  ul { list-style:none; margin:0; padding:0; max-height:480px; overflow-y:auto; }
  li { display:grid; grid-template-columns:16px 1fr auto auto; gap:8px; align-items:center; padding:7px 14px; cursor:pointer; position:relative; }
  li:hover { background:var(--hover); }
  li img { width:16px; height:16px; }
  .title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mem { font-variant-numeric:tabular-nums; font-weight:600; text-align:right; min-width:64px; }
  .mem.na { color:var(--muted); font-weight:400; }
  .bar { position:absolute; left:0; bottom:0; height:2px; background:var(--bar); }
  button { font:inherit; font-size:11px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:5px; padding:2px 6px; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
  <header><h1>Tab memory</h1><span id="total">Measuring…</span><button id="sleepAll" title="Unload every tab except Spotify, Folklore and the tab you're on">Sleep all others</button></header>
  <div class="note" id="note"></div>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
